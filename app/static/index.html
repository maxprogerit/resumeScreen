<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Screener</title>
  <meta name="description" content="Explainable resume ranking. Decision support for recruiters.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FFD84D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="accent-bar" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="logo">Resume <span class="accent">Screener</span></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <p class="note">Decision support only. A human makes the hiring decision.</p>
        <button type="button" class="btn btn-ghost btn-sm" id="signout" hidden>Sign out</button>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toasts" class="toasts"></div>
  <noscript><p class="noscript">This app needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
